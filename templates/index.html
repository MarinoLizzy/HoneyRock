<html>
<head>
    <title>Guest Services</title>
</head>

<body>
<h1>Cabin Status</h1>

<table border="1">
<tr>
<th>Cabin</th>
<th>Status</th>
<th>Next Arrival</th>
<th>Next Guest</th>
<th>Num Queen</th>
</tr>

{% for cabin in cabins %}
<tr>
<td>{{ cabin.Name }}</td>
<td>{{ cabin.Status }}</td>
<td>{{ cabin.NextBooking }}</td>
<td>{{ cabin.NextGuest }}</td>
<td>{{ cabin.NumQueen }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>

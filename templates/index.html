<html>
<head>
    <title>Guest Services</title>
</head>

<body>
<h1>Cabin Status</h1>

<table border="1">
<tr>
<th>Cabin</th>
<th>Status</th>
</tr>

{% for cabin in cabins %}
<tr>
<td>{{ cabin.name }}</td>
<td>{{ cabin.status }}</td>
<td>{{ cabin.next_arrival }}</td>
<td>{{ cabin.next_guest }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
